<!DOCTYPE html>
<html lang="ja">
<head>

    <title>第一回 クソUI_WEBアンケート選手権ポータル</title>
    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1>第一回 クソUI_WEBアンケート選手権</h1>
        <p>エントリーされた最悪なアンケートたちを実際に触って、「クソ」だと思ったものに投票してください。</p>
        <p>※通常ボタンは複数投票。トップオブクソは全体で1回のみです。</p>
        <p>02のみデータが本当に飛んでいくのでメールアドレスはなんか適当に入力してね。</p>
    </header>

    <main>
        <div class="entries-grid">

            <div class="entry-card" data-entry-id="entry01">

                    <a href="entries/entry01/main.html" target="_blank" class="thumbnail-link">
                        <div class="overlay-text">▶ 全画面で遊ぶ</div>
                        <iframe src="entries/entry01/main.html" sandbox="allow-scripts"></iframe>
                    </a>
                </div>
                <div class="vote-area">
                    <button class="vote-button normal-btn" onclick="handleNormalVote('entry01')">
                        💩 クソ！<br><small>(各作品1回)</small>
                    </button>
                
                    <button class="vote-button top-btn" onclick="handleTopVote('entry01')">
                        👑 トップクソ！<br><small>(1人1回のみ)</small>
                    </button>
                </div>
            </div>
