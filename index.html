<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一回 クソアンケート選手権ポータル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>第一回 クソアンケート選手権</h1>
        <p>エントリーされた最悪なアンケートたちを実際に触って、一番「クソ」だと思ったものに投票してください。</p>
    </header>

    <main>
        <div class="entries-grid">
            
            <div class="entry-card" data-entry-id="entry01">
                <h2 class="entry-title">エントリーNo.01：[作品タイトルA]</h2>
                <div class="iframe-container">
                    <iframe src="entries/entry01/index.html" sandbox="allow-scripts"></iframe>
                </div>
                <div class="vote-area">
                    <button class="vote-button" onclick="handleVote('entry01')">これが一番クソ！</button>
                    <span class="vote-count" id="count-entry01">0 クソ</span>
                </div>
            </div>

            <div class="entry-card" data-entry-id="entry02">
                <h2 class="entry-title">エントリーNo.02：[作品タイトルB]</h2>
                <div class="iframe-container">
                    <iframe src="entries/entry02/index.html" sandbox="allow-scripts"></iframe>
                </div>
                <div class="vote-area">
                    <button class="vote-button" onclick="handleVote('entry02')">これが一番クソ！</button>
                    <span class="vote-count" id="count-entry02">0 クソ</span>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
