<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRCサービスご利用に従ってのアンケート</title>
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
    <textarea id="episode" class="background-textarea"></textarea>

    <div class="form-container" id="kusoWindow">
        <h2>VRCサービスご利用に従ってのアンケート</h2>
        <form id="kusoForm">
            
            <div class="form-group">
                <label for="name">名前 ※必須</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">メールアドレス ※必須</label>
                <input type="text" id="email">
            </div>

            <div class="form-group">
                <label>VRCを始めたのはいつですか？ ※必須</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="startYear" required></select>
                    
                    <div class="month-day-controller">
                        <button type="button" id="btnUp">▲</button>
                        <input type="text" id="startMonthDay" readonly placeholder="月日">
                        <button type="button" id="btnDown">▼</button>
                    </div>

                    <h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1><h1></h1>
                    <button type="submit" class="submit-btn">送信する</button>
                </div>
            </div>

            <div class="form-group">
                <label>VRCでは主に何をされてますか？ ※必須</label>
                <label class="radio-label">
                    <input type="radio" name="activity" class="fake-checkbox" value="chat" required> 雑談
                </label>
                <label class="radio-label">
                    <input type="radio" name="activity" class="fake-checkbox" value="game"> ゲームワールド
                </label>
                <label class="radio-label">
                    <input type="radio" name="activity" class="fake-checkbox" value="event"> イベント参加
                </label>
                <label class="radio-label">
                    <input type="radio" name="activity" class="fake-checkbox" value="sleep"> V睡
                </label>
                <label class="radio-label">
                    <input type="radio" name="activity" class="fake-checkbox" value="full_track"> フルトラを購入したにも関わらず、座って雑談する
                </label>
            </div>

            <div class="form-group">
                <label>VRCで好きなワールド名を教えてください ※必須</label>
                
                <div id="worldInputsContainer" class="world-inputs-wrapper">
                    <div>１：<input type="text" class="world-input-box" id="world_1"></div>
                    <div>３：<input type="text" class="world-input-box" id="world_3"></div>
                    <div>４：<input type="text" class="world-input-box" id="world_4"></div>
                    <div>５：<input type="text" class="world-input-box" id="world_5"></div>
                    <div>２：<input type="text" class="world-input-box" id="world_2"></div>
                </div>

                <div class="slider-container">
                    <input type="range" id="worldSlider" min="0" max="100" value="45" step="1">
                    <div class="slider-ticks">
                        <span style="left: 0%;">1</span>
                        <span style="left: 12%;">2</span>
                        <span style="left: 45%;">3</span>
                        <span style="left: 65%;">4</span>
                        <span style="left: 80%;">5</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="episode">VRCで楽しかったエピソードを書いてください (60文字) ※必須</label>
            </div>

        </form>
    </div>

    <script src="js/form.js"></script>
</body>
</html>
